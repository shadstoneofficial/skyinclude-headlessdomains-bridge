name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
      - run: php -l public/index.php
      - run: php -l src/ReservedActivation.php
      - run: php -l tests/contract.php
      - run: php tests/contract.php
